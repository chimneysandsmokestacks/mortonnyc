<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NYC - James Morton</title>
  <meta name="description" content="Google Maps-based collections of restaurants, cultural sights, and stores in New York, curated by James Morton.">
  <meta property="og:locale" content="en_US">
  <meta property="og:type" content="article">
  <meta property="og:title" content="NYC - James Morton">
  <meta property="og:description" content="Google Maps-based collections of restaurants, cultural sights, and stores in New York, curated by James Morton.">
  <meta property="og:url" content="https://morton.nyc/nyc/">
  <link rel="canonical" href="https://morton.nyc/nyc/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #113d3d;
      color: #f8f8f8;
      font-family: "Inter", sans-serif;
      font-size: clamp(1.1rem, 1.1rem + ((1vw - 0.2rem) * 0.375), 1.4rem);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      max-width: 640px;
      width: 100%;
    }

    p {
      margin-bottom: calc(16px + 1.5625vw);
    }

    a, a:visited {
      color: #f8f8f8;
      text-decoration: underline;
    }

    a:hover {
      color: #f8f8f8;
      text-decoration: none;
    }

    a:focus {
      text-decoration: underline dashed;
    }

    a:active {
      color: #f8f8f8;
      text-decoration: none;
    }

    .category {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 1rem;
      margin-bottom: calc(16px + 1.5625vw);
    }

    .category img {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      .category {
        grid-template-columns: 1fr;
      }
    }

    .back {
      display: inline-block;
      margin-top: calc(8px + 1.5625vw);
      color: #f8f8f8;
      text-decoration: none;
      border: 2px solid #f8f8f8;
      padding: 0.5em 1.25em;
      text-transform: uppercase;
      font-size: clamp(0.85rem, 0.85rem + ((1vw - 0.2rem) * 0.188), 1rem);
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .back:hover {
      background-color: #f8f8f8;
      border-color: #f8f8f8;
      color: #113d3d;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p>Here are a few Google Maps-based collections of restaurants, cultural sights, and stores in New York. I continually update these as I explore the streets of this city.</p>
    <div class="category">
      <a href="https://maps.app.goo.gl/yHcfVNjfeg61TzTPA" target="_blank" rel="noreferrer noopener">Restaurants/Bars</a>
      <a href="https://maps.app.goo.gl/yHcfVNjfeg61TzTPA" target="_blank" rel="noreferrer noopener"><img src="images/restaurants.png" alt="Map of restaurant and bar recommendations in NYC"></a>
    </div>
    <div class="category">
      <a href="https://maps.app.goo.gl/neK31B2aWmuPXKdy6" target="_blank" rel="noreferrer noopener">Culture</a>
      <a href="https://maps.app.goo.gl/neK31B2aWmuPXKdy6" target="_blank" rel="noreferrer noopener"><img src="images/culture.png" alt="Map of cultural sights in NYC"></a>
    </div>
    <div class="category">
      <a href="https://maps.app.goo.gl/sq2F8dVb5LZ9xkew9" target="_blank" rel="noreferrer noopener">Stores</a>
      <a href="https://maps.app.goo.gl/sq2F8dVb5LZ9xkew9" target="_blank" rel="noreferrer noopener"><img src="images/stores.png" alt="Map of store recommendations in NYC"></a>
    </div>
    <a class="back" href="/">back</a>
  </main>
  <script src="../bg.js"></script>
</body>
</html>
