  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #113d3d;
      color: #f8f8f8;
      font-family: "Inter", sans-serif;
      font-size: clamp(1.1rem, 1.1rem + ((1vw - 0.2rem) * 0.375), 1.4rem);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      max-width: 640px;
      width: 100%;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(3.2rem, 3.2rem + ((1vw - 0.2rem) * 3.066), 5.653rem);
      line-height: 1.1;
      margin-bottom: calc(16px + 1.5625vw);
    }

    p {
      margin-top: calc(16px + 1.5625vw);
    }

    p:first-of-type {
      margin-top: 0;
    }

    a {
      color: #abb8c3;
      text-decoration: underline;
    }

    a:hover {
      color: #abb8c3;
      text-decoration: none;
    }

    a:focus {
      text-decoration: underline dashed;
    }

    a:active {
      color: #abb8c3;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hi,</h1>
    <p>James here.</p>
    <p>I'm a product manager based in NYC.</p>
    <p>For recommendations on what to do in my favorite city, click <a href="/nyc/">here</a>.</p>
    <p>You can reach me on <a href="https://www.linkedin.com/in/jamessmorton" target="_blank" rel="noreferrer noopener">LinkedIn</a>.</p>
  </main>
</body>
</html>
